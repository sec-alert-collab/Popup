<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerte Sécurité!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top scrolling banner -->
    <div class="scrolling-banner top-banner">
        <div class="banner-content">
            <img src="https://via.placeholder.com/200x80?text=Virus+Warning" alt="Virus">
            <img src="https://via.placeholder.com/200x80?text=Antivirus" alt="Antivirus">
            <img src="https://via.placeholder.com/200x80?text=Virus+Warning" alt="Virus">
            <img src="https://via.placeholder.com/200x80?text=Antivirus" alt="Antivirus">
        </div>
    </div>

    <!-- Main Alert Popup -->
    <div class="alert-popup">
        <!-- Left rotating image -->
        <div class="side-image left-image">
            <img src="https://via.placeholder.com/250x250?text=Trojan+Warning" alt="Trojan Warning Left">
        </div>

        <!-- Center content -->
        <div class="popup-content">
            <div class="pulsating-icon">⚠️</div>
            <h1>Alerte Sécurité!</h1>
            <p class="warning-text">Votre ordinateur est infecté par un logiciel malveillant. <strong>Ne pas éteindre l'ordinateur.</strong></p>
            <p class="contact-text">Veuillez immédiatement contacter l'assistance en ligne .</p>
            <a href="tel:01254554478" class="contact-button">Assistance en ligne</a>
        </div>

        <!-- Right rotating image -->
        <div class="side-image right-image">
            <img src="https://via.placeholder.com/250x250?text=Trojan+Warning" alt="Trojan Warning Right">
        </div>
    </div>

    <!-- Bottom scrolling banner -->
    <div class="scrolling-banner bottom-banner">
        <div class="banner-content">
            <img src="https://via.placeholder.com/200x80?text=Security+Alert" alt="Security">
            <img src="https://via.placeholder.com/200x80?text=Warning" alt="Warning">
            <img src="https://via.placeholder.com/200x80?text=Security+Alert" alt="Security">
            <img src="https://via.placeholder.com/200x80?text=Warning" alt="Warning">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
